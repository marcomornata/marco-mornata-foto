<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <!-- Viewport ottimizzato per bloccare lo zoom indesiderato al cambio pagina e mantenere l'aderenza mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Sito Galleria - Marco Mornata</title>
    <!-- Font Jost (spessore 300) via Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300&display=swap" rel="stylesheet">

    <style>
        /* REGOLE GLOBALI E FONT SOTTILE */
        *, *::before, *::after {
            box-sizing: border-box;
            font-family: "Futura", "Jost", "Century Gothic", AppleGothic, sans-serif !important;
            font-weight: 300 !important;
        }

        html {
            background-color: #000000;
            transition: background-color 0.4s ease;
            -webkit-text-size-adjust: 100%;
            overflow-y: scroll; 
        }

        html.light-mode {
            background-color: #f0f0f0;
        }

        body {
            background-color: #000000;
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            user-select: none;
            -webkit-user-select: none;
            transition: background-color 0.4s ease;
            -webkit-overflow-scrolling: touch;
        }

        body.light-mode { 
            background-color: #f0f0f0; 
        }

        /* DIMENSIONE STANDARD TESTI E PULSANTI */
        button, .top-nav-btn, .tag-btn {
            font-size: 14px !important;
            letter-spacing: 2px !important;
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
            white-space: nowrap;
            transition: opacity 0.3s ease;
        }

        /* Nomi sotto le anteprime delle gallerie */
        .overview-card span {
            font-size: 11px !important;
            letter-spacing: 2.5px !important;
            opacity: 0.6;
        }

        button:hover, .tag-btn:hover { opacity: 0.5; }

        /* STILE SPECIFICO PER I TAG DI FILTRAGGIO */
        .tags-container {
            display: flex;
            gap: 25px;
            align-items: center;
        }

        .tag-btn {
            color: #000000;
            opacity: 0.4;
        }

        .tag-btn.active {
            opacity: 1;
            font-weight: 500 !important;
        }

        /* INTESTAZIONE FISSA IN ALTO PERFETTAMENTE UNIFICATA */
        .page-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            padding: 22px 40px;
            background: #000000;
            transition: background-color 0.4s ease;
        }

        body.light-mode .page-header {
            background: #f0f0f0;
        }

        .header-spacer {
            height: 90px;
        }

        .screen-main-menu .top-nav-btn { color: #ffffff; }
        .overview-wrapper .top-nav-btn, .gallery-wrapper .top-nav-btn { color: #000000; }

        /* STRUTTURA SCHERMATE */
        .screen-main-menu, .overview-wrapper, .gallery-wrapper {
            display: none;
            width: 100%;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .screen-main-menu.active, .overview-wrapper.visible, .gallery-wrapper.visible {
            opacity: 1;
        }

        .screen-main-menu {
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
        }

        .home-content-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            width: 100%;
            max-width: 460px;
            margin: 0 auto;
            padding: 0 20px;
            margin-top: -30px;
        }

        .logo-diaphragm {
            position: relative;
            display: block;
            width: 100%;
            aspect-ratio: 1 / 1;
            max-height: 42vh;
            max-height: 42dvh;
            cursor: pointer;
            transition: opacity 0.3s ease, transform 0.3s ease;
            text-decoration: none;
        }

        .logo-diaphragm:hover {
            opacity: 0.75;
            transform: scale(0.99);
        }

        .logo-diaphragm svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            overflow: visible;
        }

        .overview-grid {
            display: flex;
            gap: 40px;
            max-width: 900px;
            margin: 0 auto;
            align-items: flex-start;
            padding: 0 40px 60px 40px;
        }

        .masonry-col {
            display: flex;
            flex-direction: column;
            gap: 40px;
            flex: 1;
            width: 50%;
        }

        .overview-card {
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        .overview-card:hover {
            opacity: 0.7;
            transform: translateY(-5px);
        }

        .gallery-list {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
            max-width: 800px;
            margin: 0 auto;
            padding: 0 40px 80px 40px;
        }

        .photo-item { width: 100%; display: block; }

        .photo-item img, .overview-card img {
            width: 100%;
            height: auto;
            max-height: 85vh;
            object-fit: contain;
            display: block;
            border-radius: 2px;
            pointer-events: none;
            -webkit-user-drag: none;
            opacity: 0;
            transform: translateY(15px);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        .photo-item img.loaded, .overview-card img.loaded {
            opacity: 1;
            transform: translateY(0);
        }

        @media (max-width: 768px) {
            .page-header { 
                padding: 15px 20px; 
                flex-direction: column; 
                align-items: flex-start; 
                gap: 10px; 
            }
            .header-spacer {
                height: 100px;
            }
            .tags-container { gap: 18px; }
            .overview-grid, .gallery-list { padding: 0 20px 40px 20px; gap: 20px; }
            .masonry-col { gap: 20px; }
            button, .top-nav-btn, .tag-btn { font-size: 12px !important; }
            .home-content-box { max-width: 85vw; margin-top: -65px; padding: 0 10px; }
            .logo-diaphragm { max-height: 36vh; max-height: 36dvh; }
        }
    </style>
</head>
<body>

    <!-- 1. SCHERMATA INIZIALE -->
    <div class="screen-main-menu active" id="screen-main-menu">
        <div class="page-header">
        </div>
        <div class="header-spacer"></div>
        <div class="home-content-box">
            <a href="#1-tutti" class="logo-diaphragm nav-overview-trigger" aria-label="Vai alle gallerie">
                <svg id="home-logo" viewBox="0 0 793.26 793.89" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
                    <defs>
                        <clipPath id="exactCircleClip">
                            <circle cx="396.63" cy="396.95" r="396.63" />
                        </clipPath>
                    </defs>
                    <g clip-path="url(#exactCircleClip)">
                        <g id="iris-blades">
                            <path fill="#ffffff" d="M 44.27,139.29 A 436.3,436.3 0 0 1 411.30,-39.37 L 411.30,356.10 Z">
                                <animate attributeName="d" from="M 44.27,139.29 A 436.3,436.3 0 0 1 411.30,-39.37 L 411.30,356.10 Z" to="M 212.38,45.35 A 396.95,396.95 0 0 1 581.21,45.53 L 581.21,258.30 Z" dur="0.65s" begin="0s" fill="freeze" calcMode="spline" keyTimes="0; 1" keySplines="0.25 0.1 0.25 1" />
                            </path>
                            <path fill="#ffffff" d="M 439.07,-37.16 A 436.3,436.3 0 0 1 782.28,192.61 L 439.07,389.07 Z">
                                <animate attributeName="d" from="M 439.07,-37.16 A 436.3,436.3 0 0 1 782.28,192.61 L 439.07,389.07 Z" to="M 609.00,61.59 A 396.95,396.95 0 0 1 793.26,381.09 L 609.00,487.47 Z" dur="0.65s" begin="0s" fill="freeze" calcMode="spline" keyTimes="0; 1" keySplines="0.25 0.1 0.25 1" />
                            </path>
                            <path fill="#ffffff" d="M 795.64,220.17 A 436.3,436.3 0 0 1 766.14,628.61 L 424.39,429.60 Z">
                                <animate attributeName="d" from="M 795.64,220.17 A 436.3,436.3 0 0 1 766.14,628.61 L 424.39,429.60 Z" to="M 793.25,413.18 A 396.95,396.95 0 0 1 608.68,732.51 L 424.42,626.12 Z" dur="0.65s" begin="0s" fill="freeze" calcMode="spline" keyTimes="0; 1" keySplines="0.25 0.1 0.25 1" />
                            </path>
                            <path fill="#ffffff" d="M 748.96,653.95 A 436.3,436.3 0 0 1 381.95,832.63 L 381.95,437.16 Z">
                                <animate attributeName="d" from="M 748.96,653.95 A 436.3,436.3 0 0 1 381.95,832.63 L 381.95,437.16 Z" to="M 580.88,748.54 A 396.95,396.95 0 0 1 212.05,748.37 L 212.05,535.60 Z" dur="0.65s" begin="0s" fill="freeze" calcMode="spline" keyTimes="0; 1" keySplines="0.25 0.1 0.25 1" />
                            </path>
                            <path fill="#ffffff" d="M 354.19,830.42 A 436.3,436.3 0 0 1 10.98,600.65 L 354.19,404.19 Z">
                                <animate attributeName="d" from="M 354.19,830.42 A 436.3,436.3 0 0 1 10.98,600.65 L 354.19,404.19 Z" to="M 184.26,732.31 A 396.95,396.95 0 0 1 0.00,412.81 L 184.26,306.42 Z" dur="0.65s" begin="0s" fill="freeze" calcMode="spline" keyTimes="0; 1" keySplines="0.25 0.1 0.25 1" />
                            </path>
                            <path fill="#ffffff" d="M -2.38,573.09 A 436.3,436.3 0 0 1 27.12,164.65 L 368.87,363.65 Z">
                                <animate attributeName="d" from="M -2.38,573.09 A 436.3,436.3 0 0 1 27.12,164.65 L 368.87,363.65 Z" to="M 0.02,380.71 A 396.95,396.95 0 0 1 184.58,61.39 L 368.84,167.77 Z" dur="0.65s" begin="0s" fill="freeze" calcMode="spline" keyTimes="0; 1" keySplines="0.25 0.1 0.25 1" />
                            </path>
                        </g>
                        <g id="center-cube" opacity="0">
                            <path fill="#ffffff" d="M 396.63036,183.81211 567.3177,282.35849 396.63036,380.90487 225.94302,282.35849 Z" />
                            <path fill="#ffffff" d="m 212.04986,306.42214 184.5805,106.5676 184.5805,-106.5676 v 197.09277 l -184.5805,106.5676 -184.5805,-106.5676 z" />
                            <animate attributeName="opacity" from="0" to="1" dur="0.45s" begin="0.55s" fill="freeze" calcMode="spline" keyTimes="0; 1" keySplines="0.16 1 0.3 1" />
                        </g>
                    </g>
                </svg>
            </a>
        </div>
    </div>

    <!-- 2. SCHERMATA PANORAMICA A griglia -->
    <div class="overview-wrapper" id="overview-wrapper">
        <div class="page-header" id="overview-header">
            <button class="top-nav-btn nav-home-trigger">MARCO MORNATA</button>
            <div class="tags-container">
                <button class="tag-btn" onclick="changeFilter('tutti', this)">TUTTI</button>
                <button class="tag-btn" onclick="changeFilter('architettura', this)">ARCHITETTURA</button>
                <button class="tag-btn" onclick="changeFilter('natura', this)">NATURA</button>
            </div>
        </div>
        <div class="header-spacer"></div>
        <div class="overview-grid" id="overview-grid"></div>
    </div>

    <!-- 3. VISUALIZZAZIONE GALLERIA FOTO -->
    <div class="gallery-wrapper" id="gallery-wrapper">
        <div class="page-header" id="gallery-header">
            <button class="top-nav-btn nav-home-trigger">MARCO MORNATA</button>
            <button class="top-nav-btn nav-overview-trigger">GALLERIE</button>
        </div>
        <div class="header-spacer"></div>
        <div class="gallery-list" id="gallery-list"></div>
    </div>

    <script>
        const elements = {
            mainMenu: document.getElementById('screen-main-menu'),
            overviewWrapper: document.getElementById('overview-wrapper'),
            overviewGrid: document.getElementById('overview-grid'),
            galleryWrapper: document.getElementById('gallery-wrapper'),
            galleryList: document.getElementById('gallery-list')
        };
        const homeLogoLink = document.querySelector('.logo-diaphragm');
        const homeLogoTemplate = document.getElementById('home-logo').cloneNode(true);

        const contentGalleries = {
            'gallery-1': [
                'galleria1/foto1.jpg',
                'galleria1/foto2.jpg'
            ],
            'gallery-2': [
                'galleria2/foto1.jpg',
                'galleria2/foto2.jpg'
            ],
            'gallery-3': [
                'galleria3/foto1.jpg',
                'galleria3/foto2.jpg'
            ],
            'gallery-4': [
                'galleria4/foto1.jpg',
                'galleria4/foto2.jpg'
            ]
        };

        let currentFilter = 'tutti';
        let currentTarget = null;

        function restartHomeLogoAnimation() {
            const currentHomeLogo = homeLogoLink.querySelector('svg');
            currentHomeLogo.replaceWith(homeLogoTemplate.cloneNode(true));
        }

        function navigateTo(target, param = null, filter = null) {
            let hash = '#0';
            if (target === 'overview') {
                const activeFilter = filter || currentFilter;
                hash = `#1-${activeFilter}`;
            } else if (target === 'gallery' && param) {
                const galleryNum = param.replace('gallery-', '');
                hash = `#${parseInt(galleryNum) + 1}`;
            }
            window.location.hash = hash;
        }

        function changeFilter(filterType, clickedElement) {
            currentFilter = filterType;
            navigateTo('overview', null, filterType);
        }

        function renderState(target, param = null, filter = 'tutti') {
            const isReturningHome = target === 'home' && currentTarget !== null && currentTarget !== 'home';
            currentTarget = target;

            elements.mainMenu.style.display = 'none';
            elements.overviewWrapper.style.display = 'none';
            elements.galleryWrapper.style.display = 'none';

            elements.mainMenu.classList.remove('active');
            elements.overviewWrapper.classList.remove('visible');
            elements.galleryWrapper.classList.remove('visible');

            // Forza il reset dello zoom e riporta la scala del browser al 100% pulito
            const viewportMeta = document.querySelector('meta[name="viewport"]');
            if (viewportMeta) {
                viewportMeta.setAttribute('content', 'width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover');
            }

            if (target === 'home') {
                document.documentElement.classList.remove('light-mode');
                document.body.classList.remove('light-mode');
                elements.mainMenu.style.display = 'flex';
                if (isReturningHome) {
                    restartHomeLogoAnimation();
                }
                requestAnimationFrame(() => elements.mainMenu.classList.add('active'));
            } else if (target === 'overview') {
                currentFilter = filter;
                updateTagButtonsUI(filter);
                document.documentElement.classList.add('light-mode');
                document.body.classList.add('light-mode');
                elements.overviewWrapper.style.display = 'block';
                renderOverviewGrid(filter);
                requestAnimationFrame(() => elements.overviewWrapper.classList.add('visible'));
            } else if (target === 'gallery' && param) {
                document.documentElement.classList.add('light-mode');
                document.body.classList.add('light-mode');
                elements.galleryWrapper.style.display = 'block';
                renderGalleryContent(param);
                requestAnimationFrame(() => elements.galleryWrapper.classList.add('visible'));
            }

            window.scrollTo(0, 0);
        }

        function updateTagButtonsUI(activeFilter) {
            document.querySelectorAll('.tag-btn').forEach(btn => {
                const text = btn.textContent.trim().toLowerCase();
                if (text === activeFilter) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }

        function renderGalleryContent(galleryId) {
            elements.galleryList.innerHTML = '';
            const currentPhotos = contentGalleries[galleryId];
            if (currentPhotos) {
                currentPhotos.forEach(srcPath => {
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'photo-item';
                    
                    const imgElement = document.createElement('img');
                    imgElement.onload = () => imgElement.classList.add('loaded');
                    imgElement.src = srcPath;
                    if (imgElement.complete) imgElement.classList.add('loaded');
                    
                    itemDiv.appendChild(imgElement);
                    elements.galleryList.appendChild(itemDiv);
                });
            }
        }

        function renderOverviewGrid(filter) {
            elements.overviewGrid.innerHTML = '';

            const col1 = document.createElement('div');
            col1.className = 'masonry-col';
            const col2 = document.createElement('div');
            col2.className = 'masonry-col';

            elements.overviewGrid.appendChild(col1);
            elements.overviewGrid.appendChild(col2);

            const galleryKeys = Object.keys(contentGalleries);
            
            galleryKeys.forEach((galleryId, index) => {
                if (filter === 'architettura' && index >= 2) return;
                if (filter === 'natura' && index >= 3) return;

                const photos = contentGalleries[galleryId];
                if (photos && photos.length > 0) {
                    const card = document.createElement('div');
                    card.className = 'overview-card';
                    card.onclick = () => navigateTo('gallery', galleryId);

                    const img = document.createElement('img');
                    img.onload = () => img.classList.add('loaded');

                    let coverPhotoIndex = 0;
                    if ((galleryId === 'gallery-2' || galleryId === 'gallery-3') && photos.length > 1) {
                        coverPhotoIndex = 1;
                    }

                    img.src = photos[coverPhotoIndex];
                    if (img.complete) img.classList.add('loaded');

                    const label = document.createElement('span');
                    label.textContent = `GALLERIA ${index + 1}`;

                    card.appendChild(img);
                    card.appendChild(label);

                    const visibleCardCount = col1.children.length + col2.children.length;
                    if (visibleCardCount % 2 === 0) {
                        col1.appendChild(card);
                    } else {
                        col2.appendChild(card);
                    }
                }
            });
        }

        function handleRouteFromHash() {
            const hash = window.location.hash;
            
            if (hash.startsWith('#1')) {
                let filter = 'tutti';
                if (hash.includes('architettura')) filter = 'architettura';
                if (hash.includes('natura')) filter = 'natura';
                renderState('overview', null, filter);
            } else if (hash === '#2') {
                renderState('gallery', 'gallery-1');
            } else if (hash === '#3') {
                renderState('gallery', 'gallery-2');
            } else if (hash === '#4') {
                renderState('gallery', 'gallery-3');
            } else if (hash === '#5') {
                renderState('gallery', 'gallery-4');
            } else {
                renderState('home');
            }
        }

        window.addEventListener('hashchange', handleRouteFromHash);

        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('.nav-home-trigger').forEach(el => {
                el.addEventListener('click', () => navigateTo('home'));
            });
            document.querySelectorAll('.nav-overview-trigger').forEach(el => {
                el.addEventListener('click', () => navigateTo('overview'));
            });

            handleRouteFromHash();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                const hash = window.location.hash;
                if (hash === '#2' || hash === '#3' || hash === '#4' || hash === '#5') {
                    navigateTo('overview');
                } else if (hash.startsWith('#1')) {
                    navigateTo('home');
                }
            }
        });

        document.addEventListener('contextmenu', e => e.preventDefault());
    </script>
</body>
</html>
