<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Morphing Diaframma SVG - Bianco su Fondo Nero</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #000000;
      font-family: system-ui, -apple-system, sans-serif;
      gap: 24px;
    }

    .stage {
      width: 380px;
      height: 380px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000000;
      border-radius: 24px;
      padding: 24px;
      border: 1px solid #222222;
    }

    .stage svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .controls {
      display: flex;
      gap: 12px;
    }

    button {
      padding: 11px 22px;
      font-size: 14px;
      font-weight: 600;
      color: #000000;
      background-color: #ffffff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    button:hover {
      background-color: #e0e0e0;
    }

    button:active {
      transform: scale(0.97);
    }

    button.download {
      color: #ffffff;
      background-color: #0d7a3e;
    }

    button.download:hover {
      background-color: #0a6332;
    }
  </style>
</head>
<body>

  <div class="stage" id="svg-container">
    <svg id="animated-svg" viewBox="0 0 793.26 793.89" width="793.26" height="793.89" xmlns="http://w3.org">
      <defs>
        <clipPath id="exactCircleClip">
          <circle cx="396.63" cy="396.95" r="396.63" />
        </clipPath>
      </defs>

      <g clip-path="url(#exactCircleClip)">
        <g id="iris-blades">
          <!-- Lamella 1 (Alto) -->
          <path fill="#ffffff" d="M 44.27,139.29 A 436.3,436.3 0 0 1 411.30,-39.37 L 411.30,356.10 Z">
            <animate attributeName="d"
              from="M 44.27,139.29 A 436.3,436.3 0 0 1 411.30,-39.37 L 411.30,356.10 Z"
              to="M 212.38,45.35 A 396.95,396.95 0 0 1 581.21,45.53 L 581.21,258.30 Z"
              dur="0.65s" begin="0s" fill="freeze"
              calcMode="spline" keyTimes="0; 1" keySplines="0.25 0.1 0.25 1" />
          </path>

          <!-- Lamella 2 (Alto-Destra) -->
          <path fill="#ffffff" d="M 439.07,-37.16 A 436.3,436.3 0 0 1 782.28,192.61 L 439.07,389.07 Z">
            <animate attributeName="d"
              from="M 439.07,-37.16 A 436.3,436.3 0 0 1 782.28,192.61 L 439.07,389.07 Z"
              to="M 609.00,61.59 A 396.95,396.95 0 0 1 793.26,381.09 L 609.00,487.47 Z"
              dur="0.65s" begin="0s" fill="freeze"
              calcMode="spline" keyTimes="0; 1" keySplines="0.25 0.1 0.25 1" />
          </path>

          <!-- Lamella 3 (Basso-Destra) -->
          <path fill="#ffffff" d="M 795.64,220.17 A 436.3,436.3 0 0 1 766.14,628.61 L 424.39,429.60 Z">
            <animate attributeName="d"
              from="M 795.64,220.17 A 436.3,436.3 0 0 1 766.14,628.61 L 424.39,429.60 Z"
              to="M 793.25,413.18 A 396.95,396.95 0 0 1 608.68,732.51 L 424.42,626.12 Z"
              dur="0.65s" begin="0s" fill="freeze"
              calcMode="spline" keyTimes="0; 1" keySplines="0.25 0.1 0.25 1" />
          </path>

          <!-- Lamella 4 (Basso) -->
          <path fill="#ffffff" d="M 748.96,653.95 A 436.3,436.3 0 0 1 381.95,832.63 L 381.95,437.16 Z">
            <animate attributeName="d"
              from="M 748.96,653.95 A 436.3,436.3 0 0 1 381.95,832.63 L 381.95,437.16 Z"
              to="M 580.88,748.54 A 396.95,396.95 0 0 1 212.05,748.37 L 212.05,535.60 Z"
              dur="0.65s" begin="0s" fill="freeze"
              calcMode="spline" keyTimes="0; 1" keySplines="0.25 0.1 0.25 1" />
          </path>

          <!-- Lamella 5 (Basso-Sinistra) -->
          <path fill="#ffffff" d="M 354.19,830.42 A 436.3,436.3 0 0 1 10.98,600.65 L 354.19,404.19 Z">
            <animate attributeName="d"
              from="M 354.19,830.42 A 436.3,436.3 0 0 1 10.98,600.65 L 354.19,404.19 Z"
              to="M 184.26,732.31 A 396.95,396.95 0 0 1 0.00,412.81 L 184.26,306.42 Z"
              dur="0.65s" begin="0s" fill="freeze"
              calcMode="spline" keyTimes="0; 1" keySplines="0.25 0.1 0.25 1" />
          </path>

          <!-- Lamella 6 (Alto-Sinistra) -->
          <path fill="#ffffff" d="M -2.38,573.09 A 436.3,436.3 0 0 1 27.12,164.65 L 368.87,363.65 Z">
            <animate attributeName="d"
              from="M -2.38,573.09 A 436.3,436.3 0 0 1 27.12,164.65 L 368.87,363.65 Z"
              to="M 0.02,380.71 A 396.95,396.95 0 0 1 184.58,61.39 L 368.84,167.77 Z"
              dur="0.65s" begin="0s" fill="freeze"
              calcMode="spline" keyTimes="0; 1" keySplines="0.25 0.1 0.25 1" />
          </path>
        </g>

        <!-- Cubo centrale identico al File 3 che entra in dissolvenza (0.55s -> 1.00s) -->
        <g id="center-cube" opacity="0">
          <path fill="#ffffff" d="M 396.63036,183.81211 567.3177,282.35849 396.63036,380.90487 225.94302,282.35849 Z" />
          <path fill="#ffffff" d="m 212.04986,306.42214 184.5805,106.5676 184.5805,-106.5676 v 197.09277 l -184.5805,106.5676 -184.5805,-106.5676 z" />
          <animate attributeName="opacity"
            from="0" to="1"
            dur="0.45s" begin="0.55s" fill="freeze"
            calcMode="spline" keyTimes="0; 1" keySplines="0.16 1 0.3 1" />
        </g>
      </g>
    </svg>
  </div>

  <div class="controls">
    <button id="replayBtn">Riproduci di nuovo</button>
    <button id="downloadBtn" class="download">Scarica file .SVG (Bianco)</button>
  </div>

  <script>
    const container = document.getElementById('svg-container');
    const replayBtn = document.getElementById('replayBtn');
    const downloadBtn = document.getElementById('downloadBtn');

    const initialSvgMarkup = container.innerHTML;

    replayBtn.addEventListener('click', () => {
      container.innerHTML = initialSvgMarkup;
    });

    downloadBtn.addEventListener('click', () => {
      const source = '<?xml version="1.0" encoding="UTF-8" standalone="no"?>\n' + initialSvgMarkup.trim();
      const blob = new Blob([source], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'animazione_diaframma_bianco.svg';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });
  </script>

</body>
</html>
